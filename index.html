<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Решение СЛАУ методом Крамера</title>
</head>
<body>
    <h4>1167675</h4>

    <div>
        <input type="number" id="n1" value="2" placeholder="A1">
        <input type="number" id="n2" value="3" placeholder="B1">
        <input type="number" id="n3" value="18" placeholder="C1">
    </div>
    <br>

    <div>
        <input type="number" id="n4" value="4" placeholder="A2">
        <input type="number" id="n5" value="-5" placeholder="B2">
        <input type="number" id="n6" value="-8" placeholder="C2">
    </div>
    <br>

    <button id="bt">Вычислить</button>

    <script>
        document.getElementById('bt').addEventListener('click', () => {
            const a1 = Number(document.getElementById('n1').value);
            const b1 = Number(document.getElementById('n2').value);
            const c1 = Number(document.getElementById('n3').value);
            const a2 = Number(document.getElementById('n4').value);
            const b2 = Number(document.getElementById('n5').value);
            const c2 = Number(document.getElementById('n6').value);

            const delta = a1 * b2 - a2 * b1;

            if (delta === 0) {
                document.getElementById('result1').value = 'Нет решения';
                document.getElementById('result2').value = 'Нет решения';
                return;
            }

            const deltaX = c1 * b2 - c2 * b1;
            const deltaY = a1 * c2 - a2 * c1;

            const x = deltaX / delta;
            const y = deltaY / delta;

            document.getElementById('result1').value = x;
            document.getElementById('result2').value = y;
        });
    </script>
</body>
</html>
